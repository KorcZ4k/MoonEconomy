name: MoonEconomy Bot Contínuo

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
  schedule:
    # Mantém uma nova execução sendo iniciada automaticamente a cada 5 horas.
    - cron: "0 */5 * * *"

concurrency:
  # Apenas uma instância do bot pode existir por vez.
  group: mooneconomy-bot-continuo
  cancel-in-progress: true

jobs:
  executar-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 299

    steps:
      - name: Checkout do MoonEconomy
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar credenciais sem revelar valores
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
        run: |
          test -n "$DISCORD_TOKEN" || (echo "DISCORD_TOKEN indisponível." && exit 1)
          test -n "$MONGODB_URI" || (echo "MONGODB_URI indisponível." && exit 1)
          test -n "$MONGODB_DATABASE" || (echo "MONGODB_DATABASE indisponível." && exit 1)
          echo "Credenciais disponíveis."

      - name: Executar MoonEconomy continuamente
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          COMMAND_PREFIX: "!"
          CICLO_ECONOMICO_ATIVO: "true"
          EVENTOS_ASSENTAMENTOS_ATIVOS: "true"
        shell: bash
        run: |
          INICIO=$(date +%s)
          LIMITE=$((299 * 60 - 30))
          echo "MoonEconomy iniciado. Esta execução será renovada automaticamente pelo próximo ciclo."

          while true; do
            AGORA=$(date +%s)
            DECORRIDO=$((AGORA - INICIO))

            if [ "$DECORRIDO" -ge "$LIMITE" ]; then
              echo "Limite de 4h58m30s atingido. Encerrando para a próxima execução automática assumir."
              exit 0
            fi

            RESTANTE=$((LIMITE - DECORRIDO))
            echo "Iniciando main.py. Tempo restante desta execução: ${RESTANTE}s"

            timeout --signal=SIGTERM "${RESTANTE}s" python main.py
            CODIGO=$?

            if [ "$CODIGO" -eq 124 ]; then
              echo "Tempo da execução encerrado."
              exit 0
            fi

            echo "main.py encerrou com código $CODIGO. Reiniciando em 10 segundos..."
            sleep 10
          done
