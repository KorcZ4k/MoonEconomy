name: MoonEconomy Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"
  push:
    paths:
      - ".github/workflows/migrar-economia.yml"
      - "main.py"
      - "requirements.txt"
      - "moon_economy/**"
      - "comandos/ECONOMIA/**"

concurrency:
  group: mooneconomy-bot
  cancel-in-progress: false

jobs:
  executar-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 299

    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
      COMMAND_PREFIX: "!"
      CICLO_ECONOMICO_ATIVO: "true"
      EVENTOS_ASSENTAMENTOS_ATIVOS: "true"

    steps:
      - name: Checkout do MoonEconomy
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar variáveis necessárias
        run: |
          test -n "$DISCORD_TOKEN" || (echo "DISCORD_TOKEN não configurada nos Secrets." && exit 1)
          test -n "$MONGODB_URI" || (echo "MONGODB_URI não configurada nos Secrets." && exit 1)
          test -n "$MONGODB_DATABASE" || (echo "MONGODB_DATABASE não configurada nos Secrets." && exit 1)

      - name: Executar MoonEconomy e reiniciar em caso de queda
        shell: bash
        run: |
          echo "MoonEconomy iniciado em $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Esta execução dura no máximo 4h59m. O cron inicia uma nova execução a cada 5 horas."

          while true; do
            echo "Iniciando main.py..."
            python main.py
            codigo=$?

            echo "main.py encerrou com código $codigo em $(date -u '+%Y-%m-%d %H:%M:%S UTC')."
            echo "Reiniciando em 10 segundos..."
            sleep 10
          done
